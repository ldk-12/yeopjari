name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check example UI states
        run: node tests/ui.cjs
      - name: Check Android integration boundaries
        run: python3 tests/integration.py
      - name: Check source-only package
        run: python3 tests/repository.py
